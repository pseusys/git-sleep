[project]
name = "git-sleep"
version = "0.1.0"
description = "Wait for pull requests across repositories, restart failed GitHub Actions and merge them in dependency order"
authors = [{ name = "Aleksandr Sergeev" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = ["githubkit (>=0.14,<0.15)", "pydantic (>=2,<3)"]

[project.scripts]
git-sleep = "git_sleep.cli:main"

[tool.poetry]
packages = [{ include = "git_sleep" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.16.8"
jsonschema = "^4.26.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
